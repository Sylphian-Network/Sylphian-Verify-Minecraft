subprojects {
    apply plugin: 'java'
 
    group = 'net.sylphian'
    version = '0.0.6'
 
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
 
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }
 
    repositories {
        mavenCentral()
    }
}
