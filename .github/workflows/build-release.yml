name: Build & Release

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build plugin jars
        run: ./gradlew shadowJar

      - name: Upload CI artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            sylphian-verify-paper/build/libs/*.jar
            sylphian-verify-velocity/build/libs/*.jar

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        run: gh release create ${{ github.ref_name }} sylphian-verify-paper/build/libs/*.jar sylphian-verify-velocity/build/libs/*.jar --title "Release ${{ github.ref_name }}" --notes "Auto-release from workflow"